server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/perfulandia_db;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:perfulandia}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:perfulandia_dev_password}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
app.rabbitmq.exchange.ordenes=perfulandia.ordenes.exchange
app.rabbitmq.exchange.dlx=perfulandia.dlx
app.rabbitmq.queue.ordenes=perfulandia.ordenes.queue
app.rabbitmq.queue.ordenes.dlq=perfulandia.ordenes.dlq
app.rabbitmq.routing-key.ordenes=ordenes.creada
app.rabbitmq.routing-key.dlq=ordenes.fallida
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
