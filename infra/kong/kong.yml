_format_version: "3.0"
_transform: true
services:
  - name: perfulandia-backend
    url: http://backend:8080
    routes:
      - name: api-backend
        paths: ["/api", "/auth", "/actuator"]
        strip_path: false
    plugins:
      - name: cors
        config:
          origins: ["http://localhost:3000"]
          methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
          headers: ["Authorization", "Content-Type"]
          exposed_headers: ["Authorization"]
          credentials: false
          max_age: 3600
